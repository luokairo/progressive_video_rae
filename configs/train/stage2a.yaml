model_config: configs/model/full_480p.yaml
data_config: configs/data/default.yaml

stage: stage2a
max_steps: 50000
global_batch_size: 64
micro_batch_size: 1
gradient_accumulation_steps: 8
precision: bf16
decoder_lr: 5.0e-5
discriminator_lr: 5.0e-5
weight_decay: 0.05
warmup_steps: 1000
gradient_clip: 1.0
cache_mode: disabled
freeze_encoder: true
freeze_projector: true
full_prefix_probability: 1.0
prefix_schedule: full
prefix_min: 1
prefix_max: 63
full_objective_weight: 1.0
prefix_objective_weight: 1.0
l1_weight: 1.0
prefix_lpips_weight: 0.5
lpips_weight: 1.0
temporal_l1_weight: 0.1
repa_local_weight: 1.0
repa_global_weight: 1.0
adversarial_weight: 0.1
discriminator_weight: 1.0
disc_start: 0
adversarial_ramp_steps: 0
discriminator_update_interval: 1
output_dir: outputs/stage2a
save_every: 1000
log_every: 10
