prefix_schedule: fixed_4_full_3_single_1_pair
prefix_min: 0
prefix_max: 46
prefix_objective_weight: 1.0
prefix_lpips_weight: 0.5
full_microbatches_per_step: 4
l1_weight: 1.0
lpips_weight: 1.0
temporal_l1_weight: 0.1
repa_local_weight: 1.0
repa_global_weight: 1.0
band_weight: 1.0
leakage_weight: 0.1
paired_delta_weight: 1.0
adversarial_weight: 0.1
