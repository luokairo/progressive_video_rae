model_config: configs/model/full_480p.yaml
data_config: configs/data/default_17f.yaml
stage: stage1a
objective_mode: full_repa
max_steps: 10000
global_batch_size: 64
micro_batch_size: 1
gradient_accumulation_steps: 8
precision: bf16
gradient_checkpointing: true
gradient_checkpointing_by_phase:
  warmup: true
  interface: true
  full: true
fused_optimizer: true
verify_ddp_gradient_sync: false
projector_lr: 1.0e-4
wan_temporal_lr: 2.0e-5
wan_spatial_lr: 5.0e-6
discriminator_lr: 5.0e-5
weight_decay: 0.05
warmup_steps: 1000
gradient_clip: 1.0
wan_interface_step: 2000
wan_full_step: 5000
l1_weight: 1.0
lpips_weight: 1.0
temporal_l1_weight: 0.1
repa_local_weight: 1.0
repa_global_weight: 1.0
adversarial_weight: 0.1
disc_start: 5000
adversarial_ramp_steps: 2000
checkpoint_root: /share/project/liujingyi/ckpts/progressive_video_rae/training
log_dir: /share/project/liujingyi/logs/waverae/progressive_video_rae
save_every: 1000
save_at_steps: [100, 500]
log_every: 10
