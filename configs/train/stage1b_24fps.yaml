model_config: configs/model/full_480p_k23_h512_24fps.yaml
data_config: configs/data/default_17f_24fps.yaml
stage: stage1b
objective_mode: nested_spectral_hrepa_full_anchor
max_steps: 90000
global_batch_size: 64
micro_batch_size: 1
gradient_accumulation_steps: 8
precision: bf16
gradient_checkpointing: true
fused_optimizer: true
projector_lr: 1.0e-4
wan_temporal_lr: 2.0e-5
wan_spatial_lr: 5.0e-6
discriminator_lr: 5.0e-5
weight_decay: 0.05
warmup_steps: 2000
gradient_clip: 1.0
prefix_schedule: fixed_7_prefix_1_p47_full
prefix_min: 0
prefix_max: 46
prefix_objective_weight: 1.0
p47_objective_weight: 1.0
prefix_lpips_weight: 0.5
p47_full_microbatches_per_step: 1
prefix_repa_schedule: fixed_6level_spatial_pyramid
