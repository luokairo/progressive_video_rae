  - [2, 3]
  - [4, 6]
  - [8, 12]
  - [15, 24]
  - [30, 48]
prefix_repa_global_weight: 1.0
prefix_repa_local_weight: 1.0
decoder_trainable_policy: temporal_interface
l1_weight: 1.0
lpips_weight: 1.0
temporal_l1_weight: 0.1
repa_local_weight: 1.0
repa_global_weight: 1.0
band_weight: 1.0
leakage_weight: 0.1
adversarial_weight: 0.05
disc_start: 0
adversarial_ramp_steps: 1000
checkpoint_root: /share/project/liujingyi/ckpts/progressive_video_rae/training
log_dir: /share/project/liujingyi/logs/waverae/progressive_video_rae
save_every: 1000
log_every: 10
